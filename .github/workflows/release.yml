name: Release APK

# Push tag versi (mis. v1.0.3) -> build APK di EAS -> rilis di GitHub.
# Aplikasi mengecek rilis terbaru ini (version.json) dan menawarkan update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Versi tag harus sama dengan app.json
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "v$APP_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan version app.json (v$APP_VERSION)"; exit 1
          fi

      - name: Build APK di EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Siapkan file rilis
        run: |
          URL=$(node -p "JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl")
          curl -L --fail -o cekstox.apk "$URL"
          node -e "require('fs').writeFileSync('version.json', JSON.stringify({version: process.env.GITHUB_REF_NAME.replace(/^v/,''), notes: ''}))"

      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" cekstox.apk version.json --title "CEKSTOX ${GITHUB_REF_NAME}" --generate-notes
