name: OTA Update

# Setiap push ke main -> kirim update JS ke HP lewat EAS Update (tanpa instal ulang APK).
# Kalau perubahan menyentuh kode native, runtimeVersion (fingerprint) berubah dan HP lama
# tidak menerimanya; untuk itu buat rilis APK baru dengan tag vX.Y.Z.
on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Publish update
        run: eas update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
